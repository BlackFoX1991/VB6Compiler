name: Build

on:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VB6Compiler.sln

      - name: Build
        run: dotnet build VB6Compiler.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test VB6Compiler.sln --configuration Release --no-build --no-restore

      - name: VISIA parity report
        run: dotnet run --project src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-build -- conformance/VISIA/4.8.7.1/prjVisia.vbp --report
