name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-agent-patch:
    if: github.ref == 'refs/heads/agent/m7-file-io-syntax'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply staged compiler patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/patches/m7-file-io-syntax.patch
          git apply .github/patches/m7-file-io-syntax.patch
          git checkout 741a272c1554a21d9b0428fa44ee974de8eaf5d0 -- .github/workflows/build.yml
          rm .github/patches/m7-file-io-syntax.patch
          rmdir .github/patches 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            src/VB6.Syntax/SyntaxKind.cs \
            src/VB6.Syntax/Nodes/SyntaxNodes.cs \
            src/VB6.Lexer/Lexer.cs \
            src/VB6.Parser/Parser.cs \
            src/VB6.Semantics/Binder.cs \
            tests/VB6.Lexer.Tests/FileNumberLexerTests.cs \
            tests/VB6.Parser.Tests/FileIoParserTests.cs \
            tests/VB6.Semantics.Tests/FileIoBinderTests.cs \
            .github/workflows/build.yml \
            .github/patches/m7-file-io-syntax.patch

          git diff --cached --check
          git status --short
          git commit -m "Parse VB6 file-number syntax"
          git push origin HEAD:agent/m7-file-io-syntax

  build-windows:
    if: github.ref != 'refs/heads/agent/m7-file-io-syntax'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VB6Compiler.sln

      - name: Build
        run: dotnet build VB6Compiler.sln --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          $failed = $false
          Get-ChildItem tests -Filter *.csproj -Recurse | Sort-Object FullName | ForEach-Object {
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            dotnet test $_.FullName --configuration Release --no-build --no-restore --logger "trx;LogFileName=$projectName.trx" --results-directory artifacts/test-results
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: VISIA parity report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet run --project src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-build -- conformance/VISIA/4.8.7.1/prjVisia.vbp --report | Tee-Object -FilePath artifacts/visia-report.txt

      - name: Publish compiler CLI
        run: dotnet publish src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-restore --output artifacts/vb6c

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload VISIA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visia-report
          path: artifacts/visia-report.txt
          if-no-files-found: error

      - name: Upload compiler CLI
        uses: actions/upload-artifact@v4
        with:
          name: vb6c-net10
          path: artifacts/vb6c/**
          if-no-files-found: error
