name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore VB6Compiler.sln

      - name: Build
        run: dotnet build VB6Compiler.sln --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/test-results | Out-Null
          $failed = $false
          Get-ChildItem tests -Filter *.csproj -Recurse | Sort-Object FullName | ForEach-Object {
            $projectName = [System.IO.Path]::GetFileNameWithoutExtension($_.Name)
            dotnet test $_.FullName --configuration Release --no-build --no-restore --logger "trx;LogFileName=$projectName.trx" --results-directory artifacts/test-results
            if ($LASTEXITCODE -ne 0) {
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }

      - name: VISIA parity report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet run --project src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-build -- conformance/VISIA/4.8.7.1/prjVisia.vbp --report | Tee-Object -FilePath artifacts/visia-report.txt

      - name: Publish compiler CLI
        run: dotnet publish src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-restore --output artifacts/vb6c

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload VISIA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visia-report
          path: artifacts/visia-report.txt
          if-no-files-found: error

      - name: Upload compiler CLI
        uses: actions/upload-artifact@v4
        with:
          name: vb6c-net10
          path: artifacts/vb6c/**
          if-no-files-found: error

      - name: Publish migration commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state="$env:RESULT_STATE" `
            -f context="direct-managed-backend/ci" `
            -f description="Direct managed backend CI: $env:RESULT_STATE"
