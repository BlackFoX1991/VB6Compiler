name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # Legacy .vbp/.vbg projects default to x86, so the CLI emits a 32-bit apphost.
      # setup-dotnet points DOTNET_ROOT at its x64 install, which a 32-bit apphost then
      # tries to load hostfxr from, failing with 0x800700C1. Install the x86 runtimes and
      # name them through DOTNET_ROOT_X86, which takes precedence for 32-bit apphosts.
      - name: Setup x86 .NET runtime for emitted legacy projects
        shell: pwsh
        run: |
          $installDirectory = Join-Path $env:RUNNER_TEMP 'dotnet-x86'
          $installScript = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile $installScript
          & $installScript -Channel 10.0 -Runtime dotnet -Architecture x86 -InstallDir $installDirectory
          & $installScript -Channel 10.0 -Runtime windowsdesktop -Architecture x86 -InstallDir $installDirectory
          "DOTNET_ROOT_X86=$installDirectory" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build, test and measure
        shell: pwsh
        run: .\build.ps1 -Configuration Release -ResultsDirectory artifacts/test-results

      - name: Publish compiler CLI
        run: dotnet publish src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-restore --output artifacts/vb6c

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload VISIA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visia-report
          path: artifacts/visia-report.txt
          if-no-files-found: error

      - name: Upload compiler CLI
        uses: actions/upload-artifact@v4
        with:
          name: vb6c-net10
          path: artifacts/vb6c/**
          if-no-files-found: error

      - name: Publish migration commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state="$env:RESULT_STATE" `
            -f context="direct-managed-backend/ci" `
            -f description="Direct managed backend CI: $env:RESULT_STATE"
