name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - agent/**
  pull_request:
    branches:
      - main
      - agent/**

permissions:
  contents: read
  statuses: write

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build, test and measure
        shell: pwsh
        run: .\build.ps1 -Configuration Release -ResultsDirectory artifacts/test-results

      - name: Publish compiler CLI
        run: dotnet publish src/VB6.Compiler.Cli/VB6.Compiler.Cli.csproj --configuration Release --no-restore --output artifacts/vb6c

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: error

      - name: Upload VISIA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visia-report
          path: artifacts/visia-report.txt
          if-no-files-found: error

      - name: Upload compiler CLI
        uses: actions/upload-artifact@v4
        with:
          name: vb6c-net10
          path: artifacts/vb6c/**
          if-no-files-found: error

      - name: Publish migration commit status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
        run: |
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" `
            -f state="$env:RESULT_STATE" `
            -f context="direct-managed-backend/ci" `
            -f description="Direct managed backend CI: $env:RESULT_STATE"
